name = "backup-watchdog"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 定时巡检：每 30 分钟一次
[triggers]
crons = ["*/30 * * * *"]

[vars]
# NodeWarden 站点地址（不要带结尾斜杠）
NW_BASE_URL = "https://nodewarden.liuyong.eu.org"
# Web Vault -> 设置 -> 安全 -> 查看 API 密钥 里显示的 client_id，形如 user.<uuid>
NW_CLIENT_ID = "user.18fd9855-55c9-4d06-b405-bc9a01c2c388"
# 同一问题重复提醒的最小间隔（小时）
COOLDOWN_HOURS = "6"
# 飞书应用机器人
FEISHU_APP_ID = "cli_aa532d25a5b9dc00"
FEISHU_CHAT_ID = "oc_1e46aedb7b902e32afa45e199f3f2185"

# 线上已绑定的 KV namespace
[[kv_namespaces]]
binding = "STATE"
id = "31522eeed7934579beab5d856add1d39"

# 以下敏感值用 wrangler secret put 写入：
#   NW_CLIENT_SECRET   NodeWarden API 密钥（client_secret）
#   FEISHU_APP_SECRET  飞书应用的 App Secret
#   WATCHDOG_TOKEN     手动触发/探针口令
